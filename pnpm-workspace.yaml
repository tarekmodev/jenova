packages:
  - "packages/*"
  - "packages/adapters/*/*"
  - "apps/*"
  - "e2e"

allowBuilds:
  # next-intl transitive tooling: both ship prebuilt binaries; their build
  # scripts are native-compile fallbacks we never need on supported hosts.
  '@parcel/watcher': false
  '@swc/core': false
  # Nest core pulls @scarf/scarf, whose postinstall is install analytics — never run it.
  '@scarf/scarf': false
  # argon2's install script is node-gyp-build: it RESOLVES the shipped
  # prebuilt N-API binary (win32/linux/mac), compiling only if none fits.
  argon2: true
  # esbuild ships the platform binary as an optional dependency; its install
  # script only verifies it (needed by tsx, which runs the migration CLIs).
  esbuild: true
  # bullmq → msgpackr → optional native accelerator; msgpackr runs pure-JS
  # without it — never build native code for it.
  msgpackr-extract: false
  unrs-resolver: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.11
