packages:
  - "packages/*"
  - "packages/adapters/*/*"
  - "apps/*"
  - "e2e"

allowBuilds:
  # esbuild ships the platform binary as an optional dependency; its install
  # script only verifies it (needed by tsx, which runs the migration CLIs).
  esbuild: true
  unrs-resolver: true

catalog:
  typescript: ^5.9.3
  vitest: ^4.1.11
