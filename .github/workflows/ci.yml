# CI never requires secrets or network beyond package registries:
# tests replay recorded sandbox traffic (@jenova/sandbox-replay) — never live suppliers.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (module boundaries)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Migration fan-out gate (issue #22): fresh control-plane + 3 synthetic
  # tenant databases (schema only — no fabricated business data), fan-out
  # dry-run then apply, then the db integration suite against the same
  # disposable server. Fails on any error.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jenova
          POSTGRES_PASSWORD: jenova
          POSTGRES_DB: jenova
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U jenova -d jenova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration fan-out (fresh control-plane + 3 synthetic tenant DBs)
        run: pnpm --filter @jenova/db migrate:ci
        env:
          JENOVA_CI_PG_URL: postgres://jenova:jenova@localhost:5432/jenova

      # JENOVA_REQUIRE_PG turns the harness's skip-when-unreachable into a
      # hard failure here: in THIS job the database must exist (the service
      # container creates POSTGRES_DB=jenova), so a skip would be a bug.
      - name: db integration tests (against the CI Postgres)
        run: pnpm --filter @jenova/db test
        env:
          JENOVA_TEST_PG_URL: postgres://jenova:jenova@localhost:5432/jenova
          JENOVA_REQUIRE_PG: "1"

      # The api's tenant-data services (offer store) prove their SQL against
      # the same disposable server; without JENOVA_TEST_PG_URL those suites
      # skip loudly (main ci job), here they must RUN — enforced by
      # JENOVA_REQUIRE_PG.
      - name: api service tests (against the CI Postgres)
        run: pnpm --filter @jenova/api test
        env:
          JENOVA_TEST_PG_URL: postgres://jenova:jenova@localhost:5432/jenova
          JENOVA_REQUIRE_PG: "1"

      # Booking engine money path (issues #66/#69): atomic transitions,
      # balanced postings, and the ledger-invariant sweep over everything the
      # run posted (the nightly-style debits===credits assertion).
      - name: booking-engine service tests (against the CI Postgres)
        run: pnpm --filter @jenova/booking-engine test
        env:
          JENOVA_TEST_PG_URL: postgres://jenova:jenova@localhost:5432/jenova
          JENOVA_REQUIRE_PG: "1"

      # Worker pending-confirmation polling (issue #68) over recorded
      # supplier traffic — never live suppliers in CI.
      - name: worker service tests (against the CI Postgres)
        run: pnpm --filter @jenova/worker test
        env:
          JENOVA_TEST_PG_URL: postgres://jenova:jenova@localhost:5432/jenova
          JENOVA_REQUIRE_PG: "1"
