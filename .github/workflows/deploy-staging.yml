# Staging deploy (docs/10: merge to main -> staging deploy).
#
# build: always runs — one production image (api + worker + db CLI in a
#   single artifact) pushed to ghcr.io/tarekmodev/jenova with GITHUB_TOKEN.
#
# deploy: gated so it no-ops safely until AWS exists. It runs only when the
#   repository variable STAGING_DEPLOY_ENABLED is "true", and it targets the
#   "staging" repository environment, which must define two environment
#   variables (values from `terraform output` in infra/staging — neither is
#   sensitive, no long-lived AWS secrets anywhere):
#     AWS_DEPLOY_ROLE_ARN   deploy_role_arn
#     STAGING_INSTANCE_ID   instance_id
#   Auth is OIDC (aws-actions/configure-aws-credentials assumes the role
#   defined in infra/staging/iam.tf; trust is pinned to this repo's staging
#   environment). The VM is reached via SSM Run Command — no SSH.
#
# Rollback = redeploy the previous tag (migrations are expand-contract, so
# code N-1 runs on schema N):
#   aws ssm send-command --instance-ids <id> --region me-south-1 \
#     --document-name AWS-RunShellScript \
#     --parameters 'commands=["/opt/jenova/deploy.sh sha-<previous-sha>"]'
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tarekmodev/jenova

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging (SSM)
    needs: build
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: me-south-1

      # /opt/jenova/deploy.sh (provisioned by infra/staging cloud-init) does
      # the whole dance on the VM: refresh env from SSM Parameter Store, pull
      # the image, migration fan-out DRY-RUN then APPLY (per-tenant failure
      # isolation lives in the @jenova/db CLI), docker compose up -d.
      # GITHUB_TOKEN is forwarded for GHCR pull while the package is private;
      # it expires when this job ends and is masked in logs.
      - name: Run deploy script on the VM
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          IMAGE_TAG: sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "jenova staging deploy $IMAGE_TAG" \
            --parameters "commands=[\"/opt/jenova/deploy.sh $IMAGE_TAG $GHCR_USER $GHCR_TOKEN\"],executionTimeout=[\"1800\"]" \
            --query Command.CommandId --output text)"
          echo "SSM command id: $CMD_ID"
          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          echo "--- deploy output ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text >&2
            echo "deploy failed with status $STATUS" >&2
            exit 1
          fi
